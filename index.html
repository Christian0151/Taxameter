<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Taxameter</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{
    --bg:#0d1117;--card:#161b22;--line:#262d36;--fg:#e6edf3;--muted:#8b949e;
    --accent:#2f81f7;--green:#3fb950;--red:#f85149;--amber:#d29922;--pause:#d29922;
    --pad:    clamp(6px, 1.4vmin, 18px);
    --gap:    clamp(6px, 1.4vmin, 16px);
    --radius: clamp(10px, 2vmin, 20px);
    --fs-label: clamp(9px,  1.4vmin, 14px);
    --fs-stat:  clamp(15px, 4.2vmin, 34px);
    --fs-btn:   clamp(15px, 4vmin, 22px);
    --fs-sub:   clamp(11px, 3vmin, 20px);
  }
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--fg);
    height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;
    padding:var(--pad);gap:var(--gap);
    padding-bottom:calc(var(--pad) + env(safe-area-inset-bottom));
    padding-top:calc(var(--pad) + env(safe-area-inset-top));
    transition:background .3s;
  }
  body.paused{background:#1a1608}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}

  /* --- Preis --- */
  .price-card{
    flex:1 1 auto;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:var(--pad);
    min-height:0;
    position:relative;
  }
  .price-label{
    font-size:var(--fs-label);letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
  }
  .price{
    font-size:clamp(52px, 17vmin, 130px);font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;
    margin:clamp(4px,1.5vmin,14px) 0;
    transition:color .2s;white-space:nowrap;
  }
  .price.run{color:var(--green)}
  body.paused .price{color:var(--pause)!important}
  .subprice{
    font-size:var(--fs-sub);color:var(--muted);
    font-variant-numeric:tabular-nums;text-align:center;line-height:1.3;
  }
  .subprice .extra{color:var(--amber);display:block;margin-top:2px}
  .subprice .extra:empty{display:none}

  .pause-badge{
    position:absolute;top:var(--pad);left:50%;
    transform:translateX(-50%) scale(.6);
    background:var(--pause);color:#000;
    font-size:clamp(9px,2.4vmin,13px);font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;
    opacity:0;transition:opacity .25s,transform .25s;
    pointer-events:none;
  }
  body.paused .pause-badge{opacity:1;transform:translateX(-50%) scale(1)}

  /* --- Statistik --- */
  .grid{
    flex:0 0 auto;
    display:grid;grid-template-columns:1fr 1fr;
    gap:var(--gap);
  }
  .stat{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);
    padding:calc(var(--pad)*1.2) calc(var(--pad)*1.4);
    display:flex;flex-direction:column;justify-content:center;min-width:0;
  }
  .stat .k{
    font-size:var(--fs-label);letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stat .v{
    font-size:var(--fs-stat);font-weight:600;margin-top:2px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* --- Status --- */
  .status-box{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    font-size:clamp(11px,3vmin,15px);color:var(--muted);
    padding:0 calc(var(--pad)*1.2);
    min-height:clamp(20px,4vmin,40px);
  }
  .status-box span:last-child{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .dot{
    width:clamp(8px,2vmin,12px);aspect-ratio:1;border-radius:50%;
    background:var(--muted);flex:none;
  }
  .dot.ok{background:var(--green)}
  .dot.warn{background:var(--amber)}
  .dot.err{background:var(--red)}
  .dot.live{background:var(--green);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* --- Buttons --- */
  .controls{
    flex:0 0 auto;
    display:grid;
    grid-template-columns: 1fr auto;   /* links Start (breit), rechts Pause */
    gap:var(--gap);
  }
  /* Reset bekommt eigene Zeile in voller Breite */
  .controls-reset{
    flex:0 0 auto;
    display:grid;
  }
  button{
    font:inherit;font-weight:600;font-size:var(--fs-btn);
    border:0;border-radius:var(--radius);
    padding:clamp(14px,3.4vmin,22px) clamp(10px,2.4vmin,24px);
    color:#fff;background:var(--accent);cursor:pointer;
    transition:filter .15s,transform .05s;
    white-space:nowrap;
    display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:clamp(52px,10vmin,72px);
  }
  button:active{transform:scale(.985)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.stop{background:var(--red)}
  button.pause{background:var(--pause);color:#000}
  button.ghost{
    background:#21262d;color:var(--fg);
    font-size:calc(var(--fs-btn)*.9);
    min-height:clamp(44px,8vmin,58px);
    padding:clamp(10px,2.4vmin,16px);
  }

  /* --- Einstellungen --- */
  details{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    border:0;border-radius:0;padding:0;
    z-index:100;display:none;overflow:hidden;
  }
  details[open]{display:flex;align-items:flex-end;justify-content:center}
  details[open]::before{content:"";position:absolute;inset:0;background:transparent}
  .settings-panel{
    position:relative;background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius) var(--radius) 0 0;
    padding:calc(var(--pad)*1.6);
    width:100%;max-width:560px;
    max-height:85dvh;overflow:auto;
    padding-bottom:calc(var(--pad)*1.6 + env(safe-area-inset-bottom));
    animation:slideUp .25s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  details summary{
    cursor:pointer;font-size:clamp(12px,3.2vmin,15px);
    color:var(--muted);list-style:none;user-select:none;
    padding:var(--pad) 0;
    display:flex;align-items:center;justify-content:space-between;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"⚙  "}
  details[open] summary::after{content:"✕";font-size:1.2em}
  details:not([open]) summary::after{content:"›";font-size:1.2em}

  .fields{display:grid;gap:var(--gap);margin-top:calc(var(--pad)*1.2)}
  label{display:grid;gap:4px;font-size:clamp(11px,2.8vmin,14px);color:var(--muted)}
  input[type=number]{
    font:inherit;font-size:clamp(15px,4vmin,19px);
    padding:clamp(10px,2.4vmin,14px);
    border-radius:calc(var(--radius)*.7);
    border:1px solid var(--line);background:#0d1117;color:var(--fg);
    width:100%;font-variant-numeric:tabular-nums;
  }
  input[type=number]:focus{
    outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;
  }
  input:disabled{opacity:.4}

  .toggle-row{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    font-size:clamp(12px,3vmin,15px);color:var(--fg);
    padding:calc(var(--pad)*.8) 0;
    border-top:1px solid var(--line);
    margin-top:calc(var(--pad)*.6);
    user-select:none;
  }
  .toggle-row input[type=checkbox]{
    appearance:none;-webkit-appearance:none;
    width:clamp(38px,9vmin,46px);height:clamp(22px,5vmin,26px);
    background:#30363d;border-radius:999px;position:relative;
    cursor:pointer;transition:background .2s;flex:none;
  }
  .toggle-row input[type=checkbox]::after{
    content:"";position:absolute;top:2px;left:2px;
    width:calc(clamp(22px,5vmin,26px) - 4px);
    height:calc(clamp(22px,5vmin,26px) - 4px);
    background:#fff;border-radius:50%;transition:transform .2s;
  }
  .toggle-row input[type=checkbox]:checked{background:var(--green)}
  .toggle-row input[type=checkbox]:checked::after{
    transform:translateX(calc(clamp(38px,9vmin,46px) - clamp(22px,5vmin,26px)));
  }
  .toggle-row .toggle-label{flex:1}
  .toggle-row .toggle-label small{
    display:block;color:var(--muted);
    font-size:clamp(10px,2.4vmin,12px);margin-top:1px;
  }
  .veh-fields{
    display:grid;gap:var(--gap);
    padding-left:clamp(8px,2vmin,16px);
    border-left:2px solid var(--line);
    margin-top:calc(var(--pad)*.4);
    transition:opacity .2s;
  }
  .veh-fields.off{opacity:.4;pointer-events:none}
  .hint{font-size:clamp(10px,2.4vmin,13px);color:var(--muted);line-height:1.5}

  /* ================================================================
     TABLET / LANDSCAPE – zweispaltig
     ================================================================ */
  @media (min-width: 700px) and (min-height: 500px) and (orientation: landscape) {
    body{
      display:grid;
      grid-template-columns: 1.15fr 1fr;
      grid-template-rows: 1fr auto auto;
      grid-template-areas:"price stats" "status status" "controls controls";
    }
    .price-card{grid-area:price;padding:calc(var(--pad)*1.5)}
    .grid{grid-area:stats;height:100%}
    .status-box{
      grid-area:status;
      background:var(--card);border:1px solid var(--line);
      border-radius:var(--radius);
      padding:0 calc(var(--pad)*1.3);
      min-height:clamp(40px,5vmin,64px);
    }
    /* Auf Tablet alles in einer Zeile */
    .controls{
      grid-area:controls;
      grid-template-columns: 1fr auto auto;
    }
    .controls-reset{
      display:contents;   /* Reset-Button wird in dieselbe Zeile integriert */
    }
    .controls-reset button{
      min-height:clamp(52px,10vmin,72px);
    }
    button{padding:clamp(16px,2.6vmin,28px) clamp(20px,3.4vmin,44px)}
    .price{font-size:clamp(90px,13vmin,170px)}

    details{
      background:transparent;display:block;
      position:fixed;inset:auto;
      top:var(--pad);right:var(--pad);
      width:auto;padding:0;pointer-events:none;
    }
    details[open]{display:block;align-items:initial;justify-content:initial}
    details[open]::before{display:none}
    .settings-panel{
      pointer-events:auto;
      border-radius:var(--radius);
      min-width:300px;max-width:380px;
      max-height:calc(100dvh - 2*var(--pad));
      padding:calc(var(--pad)*1.4);
      padding-bottom:calc(var(--pad)*1.4 + env(safe-area-inset-bottom));
      border:1px solid var(--line);
      animation:none;
    }
    details:not([open]) .settings-panel{display:none}
    details summary{
      pointer-events:auto;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:calc(var(--pad)*1.2);
      color:var(--fg);
    }
  }
  @media (min-width: 1100px) and (min-height: 700px) and (orientation: landscape) {
    body{grid-template-columns: 1.25fr 1fr}
    .price{font-size:clamp(120px,14vmin,220px)}
  }
  @media (min-width: 700px) and (orientation: portrait) {
    .price{font-size:clamp(90px,18vmin,200px)}
    .stat .v{font-size:clamp(22px,4.5vmin,40px)}
  }
</style>
</head>
<body>

<div class="card price-card">
  <div class="pause-badge">Pause</div>
  <div class="price-label">Fahrpreis</div>
  <div class="price" id="price">0,00 €</div>
  <div class="subprice" id="perKm">
    0,108 € / km<span class="extra" id="extraInfo"></span>
  </div>
</div>

<div class="grid">
  <div class="stat"><div class="k">Strecke</div><div class="v" id="dist">0,00 km</div></div>
  <div class="stat"><div class="k">Fahrzeit</div><div class="v" id="time">00:00:00</div></div>
  <div class="stat"><div class="k">Ø Tempo</div><div class="v" id="speed">0,0 km/h</div></div>
  <div class="stat"><div class="k">Aktuell</div><div class="v" id="cur">–</div></div>
</div>

<div class="status-box"><span class="dot" id="dot"></span><span id="status">Bereit</span></div>

<!-- Start (breit) + Pause nebeneinander -->
<div class="controls">
  <button id="startBtn">▶ Start</button>
  <button id="pauseBtn" class="pause" disabled>❚❚ Pause</button>
</div>

<!-- Reset in voller Breite darunter -->
<div class="controls-reset">
  <button id="resetBtn" class="ghost">↻ Reset</button>
</div>

<details id="settings">
  <div class="settings-panel">
    <summary>Einstellungen</summary>
    <div class="fields">
      <label>Verbrauch (L / 100 km)
        <input type="number" id="consumption" value="6" step="0.1" min="0" inputmode="decimal">
      </label>
      <label>Kraftstoffpreis (€ / L)
        <input type="number" id="fuelPrice" value="1.80" step="0.01" min="0" inputmode="decimal">
      </label>
      <label>Grundpreis (€)
        <input type="number" id="baseFare" value="0" step="0.10" min="0" inputmode="decimal">
      </label>

      <label class="toggle-row">
        <input type="checkbox" id="vehEnabled">
        <span class="toggle-label">
          Fahrzeugkosten einrechnen
          <small>Wartung, Reifen, Verschleiß, Abschreibung</small>
        </span>
      </label>

      <div class="veh-fields off" id="vehFields">
        <label>Fahrzeugkosten (€ / km)
          <input type="number" id="vehCost" value="0.10" step="0.01" min="0" inputmode="decimal">
        </label>
      </div>

      <div class="hint" id="hint"></div>
    </div>
  </div>
</details>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const el = {
    price: $('price'), perKm: $('perKm'), dist: $('dist'), time: $('time'),
    speed: $('speed'), cur: $('cur'), dot: $('dot'), status: $('status'),
    startBtn: $('startBtn'), pauseBtn: $('pauseBtn'), resetBtn: $('resetBtn'),
    consumption: $('consumption'), fuelPrice: $('fuelPrice'), baseFare: $('baseFare'),
    vehEnabled: $('vehEnabled'), vehCost: $('vehCost'), vehFields: $('vehFields'),
    hint: $('hint'), extraInfo: $('extraInfo'),
    settings: $('settings')
  };
  const eur = new Intl.NumberFormat('de-DE', { style:'currency', currency:'EUR' });
  const num = (v, d=2) => v.toLocaleString('de-DE',
    { minimumFractionDigits:d, maximumFractionDigits:d });

  const S = {
    state: 'idle',
    watchId: null,
    totalKm: 0,
    lastPos: null,
    startTime: 0,
    elapsedMs: 0,
    timerId: null,
    wakeLock: null
  };
  const SETTINGS_KEY = 'gps-taxameter-settings';

  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      if (s.consumption != null) el.consumption.value = s.consumption;
      if (s.fuelPrice  != null) el.fuelPrice.value  = s.fuelPrice;
      if (s.baseFare   != null) el.baseFare.value   = s.baseFare;
      if (s.vehCost    != null) el.vehCost.value    = s.vehCost;
      el.vehEnabled.checked = !!s.vehEnabled;
    } catch (e) {}
    updateVehUI();
  }
  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        consumption: readNum(el.consumption, 6),
        fuelPrice:   readNum(el.fuelPrice, 1.8),
        baseFare:    readNum(el.baseFare, 0),
        vehCost:     readNum(el.vehCost, 0.10),
        vehEnabled:  el.vehEnabled.checked
      }));
    } catch (e) {}
  }
  function readNum(input, fallback) {
    const v = parseFloat(String(input.value).replace(',', '.'));
    return Number.isFinite(v) && v >= 0 ? v : fallback;
  }

  function fuelCostPerKm() {
    return readNum(el.consumption,6)/100 * readNum(el.fuelPrice,1.8);
  }
  function vehCostPerKm() {
    return el.vehEnabled.checked ? readNum(el.vehCost, 0.10) : 0;
  }
  function costPerKm() { return fuelCostPerKm() + vehCostPerKm(); }
  function totalCost() { return readNum(el.baseFare,0) + S.totalKm * costPerKm(); }

  function updateVehUI() {
    const on = el.vehEnabled.checked;
    el.vehFields.classList.toggle('off', !on);
    el.vehCost.disabled = !on || S.state !== 'idle';
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371, rad = Math.PI/180;
    const dLat = (lat2-lat1)*rad, dLon = (lon2-lon1)*rad;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.min(1, Math.sqrt(a)));
  }

  function render() {
    el.price.textContent = eur.format(totalCost());
    el.dist.textContent  = num(S.totalKm) + ' km';

    el.perKm.childNodes[0].nodeValue = num(costPerKm(),3) + ' € / km  ';
    el.extraInfo.textContent = el.vehEnabled.checked
      ? `(Kraftstoff ${num(fuelCostPerKm(),3)} + Fahrzeug ${num(vehCostPerKm(),3)})`
      : '';

    const parts = [
      `Kraftstoff: ${num(fuelCostPerKm(),3)} €/km`,
      el.vehEnabled.checked ? `Fahrzeug: ${num(vehCostPerKm(),3)} €/km` : null,
      `Gesamt: ${num(costPerKm(),3)} €/km`
    ].filter(Boolean);
    el.hint.textContent = parts.join('  ·  ');
  }

  function renderTimeDisplay(totalMs) {
    const s = Math.floor(totalMs/1000);
    el.time.textContent =
      `${String(Math.floor(s/3600)).padStart(2,'0')}:` +
      `${String(Math.floor((s%3600)/60)).padStart(2,'0')}:` +
      `${String(s%60).padStart(2,'0')}`;
    const hours = totalMs/3600000;
    el.speed.textContent = num(hours>0.0015 ? S.totalKm/hours : 0, 1) + ' km/h';
  }
  function setStatus(text, kind) {
    el.status.textContent = text;
    el.dot.className = 'dot' + (kind ? ' '+kind : '');
  }

  function updateUI() {
    const running = S.state === 'running';
    const paused  = S.state === 'paused';
    const idle    = S.state === 'idle';

    // Start-Button: Start / Stop
    el.startBtn.textContent = (running || paused) ? '■ Stop' : '▶ Start';
    el.startBtn.classList.toggle('stop', running || paused);

    // Pause-Button: nur in laufendem Zustand sichtbar/aktiv
    el.pauseBtn.disabled = idle;
    el.pauseBtn.textContent = paused ? '▶ Weiter' : '❚❚ Pause';
    el.pauseBtn.style.background = paused ? 'var(--green)' : 'var(--pause)';
    el.pauseBtn.style.color = paused ? '#fff' : '#000';

    el.price.classList.toggle('run', running);
    document.body.classList.toggle('paused', paused);

    const lockInputs = !idle;
    [el.consumption, el.fuelPrice, el.baseFare, el.vehEnabled]
      .forEach(i => i.disabled = lockInputs);
    updateVehUI();
  }

  function onPosition(pos) {
    if (S.state !== 'running') return;
    const c = pos.coords, acc = c.accuracy ?? 999;
    const lat = c.latitude, lon = c.longitude;
    const now = pos.timestamp || Date.now();
    if (typeof c.speed === 'number' && c.speed >= 0)
      el.cur.textContent = num(c.speed*3.6,1)+' km/h';
    if (acc > 50) { setStatus(`GPS schwach (±${Math.round(acc)} m)`,'warn'); return; }
    if (!S.lastPos) {
      S.lastPos={lat,lon,t:now};
      setStatus(`GPS aktiv · ±${Math.round(acc)} m`,'live');
      return;
    }
    const dt = (now - S.lastPos.t)/1000;
    const d = haversine(S.lastPos.lat, S.lastPos.lon, lat, lon);
    if (dt > 0 && (d/dt)*3600 > 250 && d > 0.05) {
      S.lastPos={lat,lon,t:now}; setStatus('GPS-Sprung verworfen','warn'); return;
    }
    if (d >= 0.004) { S.totalKm += d; S.lastPos={lat,lon,t:now}; render(); }
    else if (d > 0) { S.lastPos={lat,lon,t:now}; }
    setStatus(`GPS aktiv · ±${Math.round(acc)} m · ${num(S.totalKm,2)} km`,'live');
  }
  function onError(err) {
    if (S.state === 'idle') return;
    const m = err.code===1 ? 'Standort verweigert' :
              err.code===2 ? 'Standort nicht verfügbar' :
              err.code===3 ? 'GPS-Timeout' : 'GPS-Fehler';
    setStatus(m,'err');
  }

  function startGPS() {
    if (S.watchId !== null) return;
    S.watchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy:true, maximumAge:0, timeout:20000
    });
  }
  function stopGPS() {
    if (S.watchId !== null) {
      navigator.geolocation.clearWatch(S.watchId);
      S.watchId = null;
    }
  }

  function startTimer() {
    S.startTime = Date.now();
    S.timerId = setInterval(() => {
      renderTimeDisplay(S.elapsedMs + (Date.now() - S.startTime));
    }, 200);
  }
  function stopTimer() {
    if (S.timerId) clearInterval(S.timerId);
    S.timerId = null;
  }

  async function acquireWakeLock() {
    try {
      if ('wakeLock' in navigator && !S.wakeLock) {
        S.wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (S.wakeLock) { S.wakeLock.release().catch(()=>{}); S.wakeLock = null; }
  }

  async function start() {
    if (S.state !== 'idle') return;
    if (!('geolocation' in navigator)) { setStatus('Kein GPS','err'); return; }

    S.state = 'running';
    S.startTime = Date.now();
    S.elapsedMs = 0;
    S.lastPos = null;

    updateUI();
    setStatus('GPS startet …','warn');
    await acquireWakeLock();
    startGPS();
    startTimer();
  }

  function pause() {
    if (S.state !== 'running') return;
    S.elapsedMs += Date.now() - S.startTime;
    stopTimer();
    stopGPS();
    releaseWakeLock();
    S.lastPos = null;
    S.state = 'paused';
    updateUI();
    renderTimeDisplay(S.elapsedMs);
    el.cur.textContent = '–';
    setStatus(`Pause · ${num(S.totalKm,2)} km · ${eur.format(totalCost())}`,'warn');
  }

  function resume() {
    if (S.state !== 'paused') return;
    S.state = 'running';
    S.startTime = Date.now();
    S.lastPos = null;
    updateUI();
    setStatus('Weiter … GPS startet','warn');
    acquireWakeLock();
    startGPS();
    startTimer();
  }

  function stop() {
    if (S.state === 'idle') return;
    if (S.state === 'running') {
      S.elapsedMs += Date.now() - S.startTime;
    }
    stopTimer();
    stopGPS();
    releaseWakeLock();

    S.state = 'idle';
    S.lastPos = null;
    updateUI();
    renderTimeDisplay(S.elapsedMs);
    el.cur.textContent = '–';
    setStatus(`Gestoppt · ${num(S.totalKm)} km · ${eur.format(totalCost())}`,'ok');
  }

  function reset() {
    stop();
    S.totalKm = 0;
    S.elapsedMs = 0;
    S.startTime = 0;
    S.lastPos = null;
    render(); renderTimeDisplay(0);
    el.cur.textContent = '–';
    setStatus('Zurückgesetzt – bereit','');
  }

  el.startBtn.addEventListener('click', () => {
    if (S.state === 'idle') start();
    else stop();
  });
  el.pauseBtn.addEventListener('click', () => {
    if (S.state === 'running') pause();
    else if (S.state === 'paused') resume();
  });
  el.resetBtn.addEventListener('click', () => {
    if ((S.state !== 'idle' || S.totalKm > 0) &&
        !confirm('Fahrt zurücksetzen?')) return;
    reset();
  });

  el.settings.addEventListener('click', (e) => {
    if (e.target === el.settings) el.settings.open = false;
  });

  [el.consumption, el.fuelPrice, el.baseFare, el.vehCost].forEach(i => {
    i.addEventListener('input', () => { saveSettings(); render(); });
    i.addEventListener('change', () => { saveSettings(); render(); });
  });
  el.vehEnabled.addEventListener('change', () => {
    updateVehUI(); saveSettings(); render();
  });
  window.addEventListener('pagehide', () => { if (S.state !== 'idle') stop(); });

  loadSettings(); render(); renderTimeDisplay(0); updateUI();
  if (!window.isSecureContext) setStatus('GPS nur über HTTPS / localhost','err');
})();
</script>
</body>
</html>
